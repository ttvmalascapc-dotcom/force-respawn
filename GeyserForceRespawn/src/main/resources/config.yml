# GeyserForceRespawn configuration

settings:
  # Seconds before the same player can be force-respawned again (abuse prevention).
  # Players with forcerespawn.bypass-cooldown ignore this.
  cooldown-seconds: 5

  # Ticks to wait after calling respawn before checking that it worked (20 ticks = 1 second).
  verify-delay-ticks: 20

  # If the normal respawn did not work after two attempts, try a last-resort fallback:
  # restore health and move the player to a safe location. See README for limitations.
  dead-fallback: true

  # World whose spawn is used when the player has no bed/anchor and their own world is unusable.
  # Leave empty to use the player's current world, then the first loaded world.
  fallback-world: ""

  # Floodgate/Geyser username prefix, used only for name matching and Bedrock detection
  # when the Floodgate API is not installed. Must match "username-prefix" in Floodgate's config.
  bedrock-prefix: "."

  # Write successful (and failed) actions to the server console/log.
  log-actions: true

messages:
  prefix: "&8[&bForceRespawn&8] &r"
  usage: "&cUsage: /%label% <player> [force]"
  no-permission: "&cYou do not have permission to do that."
  no-force-permission: "&cYou do not have permission to use the force flag."
  player-not-found: "&cNo online player named &f%target%&c."
  ambiguous-player: "&cMore than one player matches &f%target%&c: &f%matches%&c. Use the exact name."
  cooldown: "&c%target% was recently force-respawned. Wait %seconds%s."
  respawn-started: "&7Sending respawn to &f%target%&7%platform%..."
  success-respawned: "&a%target% was respawned and resynchronised."
  success-alive-recovered: "&a%target% was alive but stuck; moved to a safe spawn and resynchronised."
  success-fallback: "&e%target% did not respond to a normal respawn; fallback recovery was applied."
  not-stuck: "&e%target% is alive and not in the void. Nothing done. Add &f force &eto resync them anyway."
  failed-still-dead: "&c%target% is still dead after all attempts. Ask them to reconnect."
  failed-offline: "&c%target% went offline before the respawn completed."
  failed-error: "&cRespawn failed for %target%: %error%"
  notify-target: "&aA staff member respawned you."
  platform-bedrock: " (Bedrock)"
  platform-java: " (Java)"
