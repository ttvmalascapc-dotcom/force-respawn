name: Build GeyserForceRespawn
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp package
      - uses: actions/upload-artifact@v4
        with:
          name: GeyserForceRespawn
          path: target/GeyserForceRespawn.jar
